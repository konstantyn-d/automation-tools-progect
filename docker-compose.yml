# The LoopCasts automation stack. Start everything with:  docker compose up -d
#
#   n8n       http://localhost:5678                       the workflows (create your login on first visit)
#   Mailpit   http://localhost:8025                       catches every e-mail, nothing leaves your laptop
#   Postgres  localhost:5432  (database "loopcasts")      orders, invoices, payments, accounts
#   Adminer   http://localhost:8080  (optional)           look inside the database:
#                                                           docker compose --profile tools up -d
#
# The first start creates the database (schema + data) and puts the workflows into n8n.
# Secrets come from .env (copy .env.example). Nothing secret is written in this file.
# Start again from zero: docker compose down -v && docker compose up -d

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loopcasts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: loopcasts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
      # optional: the cleaned legacy data (python scripts/clean_data.py). Without it the stack
      # starts with products and prices only.
      - ./data/clean:/seed/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loopcasts} -d loopcasts"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP

  # Runs once before n8n: credentials (from .env) and the workflows in n8n/workflows.
  n8n-import:
    image: n8nio/n8n:2.42.0
    depends_on:
      db:
        condition: service_healthy
    environment: &n8n-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-loopcasts}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: Europe/Brussels
      TZ: Europe/Brussels
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_LISTEN_ADDRESS: 0.0.0.0
      POSTGRES_USER: ${POSTGRES_USER:-loopcasts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/workflows/import.sh"]
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/workflows:ro

  n8n:
    image: n8nio/n8n:2.42.0
    restart: unless-stopped
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment: *n8n-env
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n

  adminer:
    image: adminer:5
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

volumes:
  pgdata:
  n8ndata:
